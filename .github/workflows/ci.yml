name: CI

'on':
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: l1871276598-dotcom/research-agent-memory
          ref: 4b85bc27f51d8d1a24cf1991ca4f1346379a294a
          path: .laos-core
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          LAOS_TEST_CORE_ROOT: ${{ github.workspace }}/.laos-core
          LAOS_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
